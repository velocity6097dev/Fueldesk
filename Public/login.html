<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FuelDesk — Log In</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">FD</div>
            <div class="login-title">FuelDesk</div>
            <div class="login-subtitle">Log in with the account your admin gave you</div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" autocomplete="username" placeholder="e.g. staff_rahul" autocapitalize="off" required>
                </div>
                <div class="input-group">
                    <label for="password">Password / PIN</label>
                    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary">Log In</button>
                <div id="login-alert" class="alert alert-danger"></div>
            </form>

            <div class="hint text-center mt-4">
                First time setting this up? Run <code>npm run create-admin</code> to create the first admin login.
            </div>
        </div>
    </div>

    <script src="/env.js"></script>
    <script src="/js/supabaseClient.js"></script>
    <script src="/login.js"></script>
</body>
</html>
