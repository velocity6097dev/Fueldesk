<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FuelDesk — Choose Panel</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="auth-screen">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-mark" style="border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;">FD</div>
                <div>
                    <h1>Welcome back</h1>
                    <p class="brand-sub" id="whoami">&nbsp;</p>
                </div>
            </div>

            <div class="choice-grid">
                <button type="button" class="choice-card" id="go-billing">
                    <div class="choice-icon amber">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 7h6M9 11h6"/></svg>
                    </div>
                    <div class="choice-text">
                        <div class="choice-title">Billing Panel</div>
                        <div class="choice-sub">Print bills at the pump</div>
                    </div>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>

                <button type="button" class="choice-card" id="go-admin">
                    <div class="choice-icon navy">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                    </div>
                    <div class="choice-text">
                        <div class="choice-title">Admin Panel</div>
                        <div class="choice-sub">Rates, receipt setup, staff</div>
                    </div>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <button type="button" class="btn btn-ghost btn-block logout-btn" style="margin-top:18px;">Log Out</button>
        </div>
    </div>

    <script src="/env.js"></script>
    <script src="/js/supabaseClient.js"></script>
    <script src="/js/authGuard.js"></script>
    <script src="/home.js"></script>
</body>
</html>
