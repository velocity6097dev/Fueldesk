<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FuelDesk — Billing</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/resources/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-screen">
        <div class="app-topbar">
            <div class="topbar-text">
                <strong>Fast Billing</strong>
                <div class="topbar-sub" id="whoami">&nbsp;</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <button type="button" class="topbar-icon-btn" id="staff-nav-btn" style="display:none;" aria-label="Manage staff">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </button>
                <span class="role-badge" id="role-badge"></span>
                <button type="button" class="btn btn-ghost btn-xs logout-btn" style="color:#fff;border-color:rgba(255,255,255,0.35);">Log Out</button>
            </div>
        </div>

        <div class="stat-bar">
            <div class="stat-chip">RATE ₹<b id="display-rate">--</b></div>
            <div class="stat-chip">DENSITY <b id="display-density">--</b></div>
        </div>

        <div class="app-main">

            <div class="settings-block">
                <div class="block-title">Product &amp; Mode</div>

                <div class="field">
                    <span>Product</span>
                    <button type="button" class="picker-btn" id="product-picker-btn">
                        <span id="product-picker-label"></span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>

                <div class="field" style="margin-top:14px;">
                    <span>Billing Mode</span>
                    <button type="button" class="picker-btn" id="mode-picker-btn">
                        <span id="mode-picker-label"></span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>

                <label class="field" style="margin-top:14px;">
                    <span id="input-value-label">Enter Volume (Liters)</span>
                    <input type="number" id="input-value" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
                </label>
            </div>

            <div class="settings-block">
                <div class="block-title">Customer Details</div>
                <div class="block-sub">Optional — printed on the receipt if filled in.</div>

                <label class="field">
                    <span>Vehicle Number</span>
                    <input type="text" id="vehicle-no" placeholder="e.g. MH12AB1234" autocapitalize="characters">
                </label>

                <label class="field" style="margin-top:14px;">
                    <span>Mobile Number</span>
                    <input type="tel" id="mobile-no" inputmode="numeric" placeholder="10-digit mobile" maxlength="10">
                </label>
            </div>

            <div class="settings-block">
                <div class="block-title">Timestamp</div>

                <div class="field">
                    <span>Bill Time</span>
                    <button type="button" class="picker-btn" id="time-mode-picker-btn">
                        <span id="time-mode-picker-label"></span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>

                <label class="field" id="custom-time-inputs" style="display:none;margin-top:14px;">
                    <span>Bill Date &amp; Time</span>
                    <input type="datetime-local" id="custom-datetime">
                </label>
            </div>

            <button type="button" id="print-btn" class="btn btn-primary btn-block" style="padding:15px;font-size:15.5px;">Print Bill</button>
            <div class="app-footer-brand"><span class="bolt">&#9889;</span> Made by Velocity.logs</div>
        </div>
    </div>

    <!-- Populated at print time by the active template's render() -->
    <div id="thermal-receipt" class="print-only"></div>

    <script src="/env.js"></script>
    <script src="/js/supabaseClient.js"></script>
    <script src="/js/authGuard.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/templates/registry.js"></script>
    <script src="/templates/bpclTokheim.js"></script>
    <script src="/templates/ioclTokheim.js"></script>
    <script src="/templates/ioclGilbarco.js"></script>
    <script src="/billing.js"></script>
</body>
</html>
