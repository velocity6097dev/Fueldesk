<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FuelDesk — Log In</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/resources/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="auth-screen">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-mark" style="border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;">FD</div>
                <div>
                    <h1>FuelDesk</h1>
                    <p class="brand-sub">Log in with the account your admin gave you</p>
                </div>
            </div>

            <form id="authForm">
                <label class="field">
                    <span>Username</span>
                    <input type="text" id="username" autocomplete="username" placeholder="e.g. staff_rahul" autocapitalize="off" required>
                </label>

                <label class="field">
                    <span>Password / PIN</span>
                    <div class="pw-wrap">
                        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
                        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </label>

                <label class="field" style="flex-direction:row;align-items:center;gap:8px;">
                    <input type="checkbox" id="remember-me" checked style="width:auto;">
                    <span style="margin:0;text-transform:none;font-size:13px;font-weight:600;color:var(--ink);">Remember me on this device</span>
                </label>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block">Log In</button>
                <p class="auth-msg" id="login-msg"></p>
            </form>

            <p class="auth-note text-center">
                First time setting this up? Run <code>npm run create-admin</code> to create the first admin login.
            </p>
            <div class="app-footer-brand"><span class="bolt">&#9889;</span> Made by Velocity.logs</div>
        </div>
    </div>

    <script src="/env.js"></script>
    <script src="/js/supabaseClient.js"></script>
    <script src="/login.js"></script>
</body>
</html>
