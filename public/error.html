<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FuelDesk — Connection Problem</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-screen">
        <div class="auth-card error-card">
            <img src="./resources/bg.gif" alt="" class="error-illustration">
            <h1 class="error-title" id="error-title">Something Went Wrong</h1>
            <p class="error-message" id="error-message">An unexpected error occurred.</p>
            <p class="error-status" id="error-status"></p>

            <button type="button" class="btn btn-primary btn-block" id="retry-btn">Try Again</button>
            <button type="button" class="btn btn-ghost btn-block" id="home-btn" style="margin-top:10px;">Go to Home</button>

            <div class="app-footer-brand"><span class="bolt">&#9889;</span> Made by Velocity.logs</div>
        </div>
    </div>

    <script src="/error.js"></script>
</body>
</html>
